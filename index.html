<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh; /* mobile browsers: use dynamic viewport height */
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 40px);
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: clamp(14px, 3vw, 24px);
    padding: clamp(20px, 5vw, 48px) clamp(18px, 5vw, 56px);
    max-width: 960px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: clamp(20px, 5vw, 36px);
  }
  h1 {
    font-size: clamp(11px, 2.5vw, 13px);
    letter-spacing: clamp(1.5px, 0.5vw, 3px);
    text-transform: uppercase;
    color: #64748b;
    margin: 0;
  }
  .live {
    font-size: clamp(10px, 2.2vw, 12px);
    color: #64748b;
    white-space: nowrap;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.3; }
    100% { opacity: 1; }
  }
  section { padding: clamp(16px, 4vw, 28px) 0; }
  .divider {
    border: none;
    border-top: 1px solid #334155;
    margin: 0;
  }
  .label {
    font-size: clamp(10px, 2.2vw, 12px);
    letter-spacing: clamp(1.5px, 0.5vw, 2.5px);
    text-transform: uppercase;
    color: #64748b;
    margin-bottom: clamp(8px, 2vw, 14px);
  }
  .q-number {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 800;
    line-height: 1;
    color: #38bdf8;
  }
  .question {
    font-size: clamp(16px, 4vw, 22px);
    line-height: 1.6;
    color: #e2e8f0;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere; /* long URLs/tokens wrap instead of overflowing */
    word-break: break-word;
  }
  .answer {
    font-size: clamp(30px, 8vw, 44px);
    font-weight: 800;
    color: #4ade80;
    letter-spacing: 2px;
    line-height: 1.2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .answer.long {
    font-size: clamp(15px, 3.5vw, 18px);
    font-weight: 500;
    letter-spacing: 0;
    color: #cbd5e1;
  }
  .flash {
    animation: flash 0.6s ease;
  }
  @keyframes flash {
    0%   { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* Small phones: tighter card, sections stack full-width (default already) */
  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; }
    .card { border-radius: 16px; }
  }

  /* Tablets & up: nothing special needed – max-width already centers the card */
</style>
</head>
<body>

<div class="card">
  <div class="topbar">
    <h1>Live Scoreboard</h1>
    <span class="live"><span class="dot"></span><span id="connState">connecting…</span> · <span id="updatedAt">–</span></span>
  </div>

  <section>
    <div class="label">Question Number</div>
    <div class="q-number" id="qNumber">--</div>
  </section>

  <hr class="divider">

  <section>
    <div class="label">Question</div>
    <p class="question" id="questionText">Waiting for data…</p>
  </section>

  <hr class="divider">

  <section>
    <div class="label">Correct Option</div>
    <div class="answer" id="answerText">--</div>
  </section>
</div>

<!-- Firebase (free Spark plan) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAPHVIYyQk4deTY1uMlj7-5IvNtpdBzFNk",
    authDomain: "eboard-bad04.firebaseapp.com",
    databaseURL: "https://eboard-bad04-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "eboard-bad04",
    storageBucket: "eboard-bad04.firebasestorage.app",
    messagingSenderId: "1058912136329",
    appId: "1:1058912136329:web:bd7648584a64955961aa58"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref("scoreboard"); // matches the path used by the bot

  const qNumEl = document.getElementById("qNumber");
  const questionEl = document.getElementById("questionText");
  const answerEl = document.getElementById("answerText");
  const updatedEl = document.getElementById("updatedAt");
  const connEl = document.getElementById("connState");

  // Pure letter list like "B" / "B,C,D" / "A, C" -> normalized "B, C, D"; else null.
  function cleanAnswer(raw) {
    if (!raw) return null;
    const m = raw.trim().match(/^[A-Ha-h](\s*[,/&]\s*[A-Ha-h])*$/);
    if (!m) return null;
    return raw
      .toUpperCase()
      .split(/[,/&]/)
      .map(s => s.trim())
      .join(", ");
  }

  ref.on("value", (snapshot) => {
    const data = snapshot.val() || {};

    qNumEl.textContent = data.score !== undefined ? data.score : "--";

    const answerRaw = (data.answer || "").trim();
    const question = (data.question || "").trim();

    if (question && question !== "(vision)") {
      questionEl.textContent = question;
    } else if (data.text) {
      questionEl.textContent = data.text; // legacy blob
    } else {
      questionEl.textContent = "(captured from screen – vision mode)";
    }

    const letters = cleanAnswer(answerRaw);
    if (letters) {
      answerEl.textContent = letters;
      answerEl.classList.remove("long");
    } else {
      // Model returned prose instead of letters – trim so the card stays readable.
      const prose = answerRaw.length > 300 ? answerRaw.slice(0, 300).trimEnd() + "…" : (answerRaw || "--");
      answerEl.textContent = prose;
      answerEl.classList.add("long");
    }

    updatedEl.textContent = data.updatedAt
      ? new Date(data.updatedAt).toLocaleString()
      : "–";

    qNumEl.classList.remove("flash");
    void qNumEl.offsetWidth; // restart animation
    qNumEl.classList.add("flash");
  });

  db.ref(".info/connected").on("value", (snap) => {
    connEl.textContent = snap.val() ? "live" : "reconnecting…";
  });
</script>

</body>
</html>
