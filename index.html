<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f1f5f9;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 32px 36px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #64748b;
    margin: 0;
  }
  .q-number {
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    background: rgba(56,189,248,0.12);
    border: 1px solid rgba(56,189,248,0.35);
    border-radius: 999px;
    padding: 4px 14px;
    white-space: nowrap;
  }
  .label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #64748b;
    margin: 18px 0 6px;
  }
  .question {
    font-size: 17px;
    line-height: 1.55;
    color: #cbd5e1;
    margin: 0;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .answer {
    display: inline-block;
    font-size: 26px;
    font-weight: 800;
    color: #4ade80;
    background: rgba(74,222,128,0.10);
    border: 1px solid rgba(74,222,128,0.35);
    border-radius: 12px;
    padding: 8px 18px;
    letter-spacing: 1px;
  }
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .option {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #64748b;
  }
  .option.correct {
    background: rgba(74,222,128,0.15);
    border-color: rgba(74,222,128,0.6);
    color: #4ade80;
  }
  .meta {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid #334155;
    font-size: 12px;
    color: #64748b;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.3; }
    100% { opacity: 1; }
  }
  .flash {
    animation: flash 0.6s ease;
  }
  @keyframes flash {
    0%   { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Live Scoreboard</h1>
    <div class="q-number" id="qNumber">Question --</div>
  </div>

  <div class="label">Question</div>
  <p class="question" id="questionText">Waiting for data…</p>

  <div class="label">Answer</div>
  <div><span class="answer" id="answerText">--</span></div>

  <div class="label">Options</div>
  <div class="options" id="optionsRow"></div>

  <div class="meta">
    <span class="dot"></span><span id="connState">connecting…</span>
    · updated <span id="updatedAt">–</span>
  </div>
</div>

<!-- Firebase (free Spark plan) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAPHVIYyQk4deTY1uMlj7-5IvNtpdBzFNk",
    authDomain: "eboard-bad04.firebaseapp.com",
    databaseURL: "https://eboard-bad04-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "eboard-bad04",
    storageBucket: "eboard-bad04.firebasestorage.app",
    messagingSenderId: "1058912136329",
    appId: "1:1058912136329:web:bd7648584a64955961aa58"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref("scoreboard"); // matches the path used by the bot

  const qNumEl = document.getElementById("qNumber");
  const questionEl = document.getElementById("questionText");
  const answerEl = document.getElementById("answerText");
  const optionsEl = document.getElementById("optionsRow");
  const updatedEl = document.getElementById("updatedAt");
  const connEl = document.getElementById("connState");

  const LETTERS = "ABCDEFGH".split("");

  function parseAnswerLetters(raw) {
    // Accept "B", "B,C,D", "B, C, D" etc. -> ["B","C","D"]
    if (!raw) return [];
    return raw
      .toUpperCase()
      .split(/[\s,\/]+/)
      .map(s => s.trim().charAt(0))
      .filter(c => LETTERS.includes(c));
  }

  function renderOptions(letters) {
    optionsEl.innerHTML = "";
    if (!letters.length) {
      optionsEl.style.display = "none";
      return;
    }
    optionsEl.style.display = "flex";
    const max = Math.max(...letters.map(c => LETTERS.indexOf(c)), 3) + 1;
    for (let i = 0; i < Math.min(max, LETTERS.length); i++) {
      const chip = document.createElement("div");
      chip.className = "option" + (letters.includes(LETTERS[i]) ? " correct" : "");
      chip.textContent = LETTERS[i];
      optionsEl.appendChild(chip);
    }
  }

  ref.on("value", (snapshot) => {
    const data = snapshot.val() || {};

    const qNum = data.score !== undefined ? data.score : "--";
    qNumEl.textContent = "Question " + qNum;

    // Prefer structured fields; fall back to the legacy "text" blob.
    const answer = (data.answer || "").trim();
    const question = (data.question || "").trim();
    if (answer || question) {
      questionEl.textContent = question && question !== "(vision)"
        ? question
        : "(captured from screen – vision mode)";
      answerEl.textContent = answer || "--";
    } else {
      questionEl.textContent = data.text || "Waiting for data…";
      answerEl.textContent = "--";
    }

    renderOptions(parseAnswerLetters(answer));

    updatedEl.textContent = data.updatedAt
      ? new Date(data.updatedAt).toLocaleString()
      : "–";

    qNumEl.classList.remove("flash");
    void qNumEl.offsetWidth; // restart animation
    qNumEl.classList.add("flash");
  });

  db.ref(".info/connected").on("value", (snap) => {
    connEl.textContent = snap.val() ? "live" : "reconnecting…";
  });
</script>

</body>
</html>
