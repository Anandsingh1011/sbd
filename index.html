<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Scoreboard</title>
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh; /* mobile browsers: use dynamic viewport height */
    background: linear-gradient(135deg, #eef2f7, #e2e8f0);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 40px);
  }
  .card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: clamp(14px, 3vw, 24px);
    padding: clamp(20px, 5vw, 48px) clamp(18px, 5vw, 56px);
    max-width: 960px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(15,23,42,0.15);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: clamp(20px, 5vw, 36px);
  }
  h1 {
    font-size: clamp(11px, 2.5vw, 13px);
    letter-spacing: clamp(1.5px, 0.5vw, 3px);
    text-transform: uppercase;
    color: #64748b;
    margin: 0;
  }
  .live {
    font-size: clamp(10px, 2.2vw, 12px);
    color: #64748b;
    white-space: nowrap;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #16a34a;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%   { opacity: 1; }
    50%  { opacity: 0.3; }
    100% { opacity: 1; }
  }
  section { padding: clamp(16px, 4vw, 28px) 0; }
  .divider {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 0;
  }
  .label {
    font-size: clamp(10px, 2.2vw, 12px);
    letter-spacing: clamp(1.5px, 0.5vw, 2.5px);
    text-transform: uppercase;
    color: #94a3b8;
    margin-bottom: clamp(8px, 2vw, 14px);
  }
  /* Question number row: question text snippet left, big number right */
  .q-number-row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 3vw, 20px);
  }
  .q-snippet {
    flex: 1;
    font-size: clamp(10px, 2vw, 13px);
    line-height: 1.5;
    color: #94a3b8;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  /* Question number and correct answer share the same big bold style */
  .hero {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    flex-shrink: 0;
  }
  .q-number { color: #2563eb; }
  .answer   { color: #16a34a; letter-spacing: 2px; }
  .answer.long {
    font-size: clamp(15px, 3.5vw, 18px);
    font-weight: 500;
    letter-spacing: 0;
    color: #475569;
  }
  .question {
    font-size: clamp(15px, 3.5vw, 18px);
    line-height: 1.6;
    color: #475569;
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .flash {
    animation: flash 0.6s ease;
  }
  @keyframes flash {
    0%   { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* Small phones: tighter card, content flows from the top */
  @media (max-width: 480px) {
    body { padding: 12px; align-items: flex-start; }
    .card { border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="topbar">
    <h1>Live Scoreboard</h1>
    <span class="live"><span class="dot"></span><span id="connState">connecting…</span> · <span id="updatedAt">–</span></span>
  </div>

  <section>
    <div class="label">Question Number</div>
    <div class="q-number-row">
      <span class="q-snippet" id="qSnippet"></span>
      <div class="hero q-number" id="qNumber">--</div>
      <p class="question" id="questionText">Waiting for data…</p>
    </div>
  </section>

   <hr class="divider">

  <section>
    <div class="label">Correct Option</div>
    <div class="hero answer" id="answerText">--</div>
  </section>
  
  <hr class="divider">

 

 
</div>

<!-- Firebase (free Spark plan) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAPHVIYyQk4deTY1uMlj7-5IvNtpdBzFNk",
    authDomain: "eboard-bad04.firebaseapp.com",
    databaseURL: "https://eboard-bad04-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "eboard-bad04",
    storageBucket: "eboard-bad04.firebasestorage.app",
    messagingSenderId: "1058912136329",
    appId: "1:1058912136329:web:bd7648584a64955961aa58"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const ref = db.ref("scoreboard"); // matches the path used by the bot

  const qNumEl = document.getElementById("qNumber");
  const qSnippetEl = document.getElementById("qSnippet");
  const questionEl = document.getElementById("questionText");
  const answerEl = document.getElementById("answerText");
  const updatedEl = document.getElementById("updatedAt");
  const connEl = document.getElementById("connState");

  // Pure letter list like "B" / "B,C,D" / "A, C" -> normalized "B, C, D".
  // If the model returned prose instead, extract any leading "X."/"(X)" option
  // markers; if none, return null so the UI shows a placeholder, not a blob.
  function cleanAnswer(raw) {
    if (!raw) return null;
    const trimmed = raw.trim();
    const m = trimmed.match(/^[A-Ha-h](\s*[,/&]\s*[A-Ha-h])*$/);
    if (m) {
      return trimmed.toUpperCase().split(/[,/&]/).map(s => s.trim()).join(", ");
    }
    // rescue: prose that still names options like "A." / "B," / "Correct: B, D"
    const picked = [...trimmed.matchAll(/\b([A-H])\s*[\.),]/g)].map(x => x[1]);
    const uniq = [...new Set(picked)];
    if (uniq.length && uniq.length <= 5) return uniq.join(", ");
    return null;
  }

  ref.on("value", (snapshot) => {
    const data = snapshot.val() || {};

    qNumEl.textContent = data.score !== undefined ? data.score : "--";

    const answerRaw = (data.answer || "").trim();
    const question = (data.question || "").trim();

    // Snippet: show question text next to the number (hide placeholder)
    qSnippetEl.textContent = (question && question !== "(vision)") ? question : "";

    if (question && question !== "(vision)") {
      // OCR mode or vision mode with extracted question text
      questionEl.textContent = question;
    } else {
      questionEl.textContent = "📷 Answer extracted from screenshot (vision mode)";
    }

    const letters = cleanAnswer(answerRaw);
    if (letters) {
      answerEl.textContent = letters;
      answerEl.classList.remove("long");
    } else {
      // Unusable prose – don't dump it on the board.
      answerEl.textContent = answerRaw ? "unreadable answer – check next cycle" : "--";
      answerEl.classList.add("long");
    }

    updatedEl.textContent = data.updatedAt
      ? new Date(data.updatedAt).toLocaleString()
      : "–";

    qNumEl.classList.remove("flash");
    void qNumEl.offsetWidth; // restart animation
    qNumEl.classList.add("flash");
  });

  db.ref(".info/connected").on("value", (snap) => {
    connEl.textContent = snap.val() ? "live" : "reconnecting…";
  });
</script>

</body>
</html>
